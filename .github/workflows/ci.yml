name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Unit tests run everywhere. They deliberately avoid importing weasyprint
  # (the CLI imports it lazily), so they need no system libraries at all.
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest tests/ -q

  # The real integration test: render the example book with every diagram
  # renderer wired up, and fail if a single diagram does not come out.
  #
  # Linux and macOS only for now. WeasyPrint on Windows needs the GTK3 runtime,
  # which has no clean unattended installer -- and Windows is the platform
  # Biblion is developed on, so it is the least likely to regress unnoticed.
  build-book:
    name: build example book (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: System libraries for WeasyPrint (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 libpangoft2-1.0-0 \
            libjpeg-dev libopenjp2-7-dev libffi-dev

      - name: System libraries for WeasyPrint (macOS)
        if: runner.os == 'macOS'
        # Homebrew puts libgobject/libpango under its own prefix, which
        # ctypes.util.find_library does not search -- so WeasyPrint imports
        # fine and then fails to dlopen at runtime. Point the loader at it.
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install pango libffi
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - name: Install mermaid-cli
        # Skip puppeteer's private Chromium download (~150MB). Biblion points
        # mermaid-cli at the browser already on the machine, so the bundled
        # copy is dead weight -- and not downloading it is the same claim the
        # tool makes to its users, so CI should be proving it works.
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Install d2 (Linux)
        if: runner.os == 'Linux'
        # A user-local prefix so the install needs no sudo.
        run: |
          curl -fsSL https://d2lang.com/install.sh | sh -s -- --prefix "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install d2 (macOS)
        if: runner.os == 'macOS'
        # Homebrew ships a d2 bottle. The upstream install script ignores
        # --prefix here and shells out to brew anyway, then dies on a broken
        # pipe writing to stdout -- so go to brew directly.
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install d2

      - name: Verify d2 is on PATH
        run: d2 --version

      - name: Install Biblion
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Show what was detected
        run: biblion doctor

      - name: Build the example book
        # --strict turns any unrendered diagram into a failed build, which is
        # the whole point of running this in CI.
        run: biblion build examples/diagram-tour --strict

      - name: Check the PDF is real
        shell: bash
        run: |
          pdf=examples/diagram-tour/output/DiagramTour.pdf
          test -f "$pdf" || { echo "no PDF produced"; exit 1; }
          python - <<'PY'
          import fitz
          doc = fitz.open("examples/diagram-tour/output/DiagramTour.pdf")
          pages = doc.page_count
          images = sum(len(doc[i].get_images()) for i in range(pages))
          unrendered = [i for i in range(pages) if "Unrendered" in doc[i].get_text()]
          print(f"pages={pages} embedded_images={images} unrendered={unrendered}")
          assert pages >= 4, f"suspiciously short book: {pages} pages"
          assert images >= 5, f"expected the diagrams to be embedded, got {images}"
          assert not unrendered, f"pages with unrendered diagrams: {unrendered}"
          PY

      - name: Upload the PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DiagramTour-${{ matrix.os }}.pdf
          path: examples/diagram-tour/output/DiagramTour.pdf
          if-no-files-found: warn
