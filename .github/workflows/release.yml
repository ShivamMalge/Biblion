name: Release

# Publishing is deliberately manual: push a tag when you mean it.
#
#     git tag v0.3.0 && git push origin v0.3.0
#
# The tag must match the version in pyproject.toml, which the first job checks
# before anything is built -- a mismatched release cannot be un-published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os, sys, tomllib
          ref = os.environ["GITHUB_REF_NAME"]
          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          if ref.lstrip("v") != version:
              sys.exit(f"tag {ref} does not match pyproject version {version}")
          print(f"tag {ref} matches version {version}")
          PY

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the metadata renders on PyPI
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A GitHub environment gives you a place to require manual approval before
    # anything reaches PyPI. Configure it under Settings -> Environments.
    environment:
      name: pypi
      url: https://pypi.org/p/biblion
    permissions:
      # Required for PyPI Trusted Publishing. No API token is stored anywhere:
      # PyPI verifies this workflow's OIDC identity instead.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
