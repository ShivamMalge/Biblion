[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# The PyPI distribution name. The bare "biblion" is held by an unrelated
# Django blog app last released in 2015. Only this string changes -- the
# import package, the CLI command and everything else stay "biblion".
name = "biblion-pdf"
version = "0.3.0"
description = "Turn plain markdown into a typeset PDF book, with real diagrams, locally and for free."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shivam" }]
keywords = ["markdown", "pdf", "book", "mermaid", "d2", "weasyprint", "typesetting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Printing",
]

dependencies = [
    "markdown>=3.5",
    "weasyprint>=60",
    "pygments>=2.17",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pymupdf>=1.24"]

[project.scripts]
biblion = "biblion.cli:main"

[project.urls]
Homepage = "https://github.com/ShivamMalge/Biblion"
Issues = "https://github.com/ShivamMalge/Biblion/issues"
Changelog = "https://github.com/ShivamMalge/Biblion/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["biblion"]

[tool.setuptools.package-data]
biblion = ["themes/*.css", "authoring_prompt.md", "skill/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
